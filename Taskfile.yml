# https://taskfile.dev

version: '3'

vars:
  GREETING: Hello, World!
  CONTAINER: docker exec -i postgres_db psql -U postgres -d mydb
  SCHEMACRAWLER_SHARE_PATH: /home/schcrwlr/share/
  SCHEMACRAWLER_EXEC: | 
    docker run --rm --network host -v "$(pwd)/notebooks/autogenerated":/home/schcrwlr/share \
          -e SC_GAVM_OPTS="--polyglot --jvm --vm.allowAllAccess=true --add-opens=java.base/java.lang=ALL-UNNAMED" \
          schemacrawler:custom \
            --server=postgresql \
            --host=host.docker.internal \
            --port=5432 \
            --database=mydb \
            --user=postgres \
            --password=postgres \
            --schemas="public.*" \

tasks:
  default:
    cmds:
      - echo "{{.GREETING}}"
    silent: true
  docker:build-schemacrawler:
    cmds:
      - docker build -f .local/schemacrawler/Dockerfile -t schemacrawler:custom .
  local:up:
    cmds:
      - docker compose down
      - docker compose build --no-cache
      - docker compose up -d
  local:up:refresh:
    cmds:
      - docker compose down -v
      - docker compose build --no-cache
      - docker compose up -d
  local:jupyter:bash:
    cmds:
      - docker compose exec notebook bash
  local:jupyter:install:
    desc: Install package in editable mode in the Jupyter container
    cmds:
      - docker compose exec notebook pip install -e .
  local:database:health-check:
    cmds:
      - echo "SELECT 1+1" | docker exec -i postgres_db psql -U postgres -d mydb
  local:database:count_all:
    cmds:
      - cat ./notebooks/sql/count_all.sql | docker exec -i postgres_db psql -U postgres -d mydb
  local:database:explaing:user_feed:
    cmds:
      - cat ./notebooks/sql/user_feed.sql | docker exec -i postgres_db psql -U postgres -d mydb
  local:database:explaing:post_with_comments:
    cmds:
      - cat ./sql/post_with_comments.sql | docker exec -i postgres_db psql -U postgres -d mydb
  local:database:explaing:friends_posts:
    cmds:
      - cat ./sql/friends_posts.sql | {{.CONTAINER}}
  local:database:diagram:
    desc: Generate database schema diagram using SchemaCrawler
    cmds:
      - |
        docker run --rm \
          --network host \
          -v "$(pwd):/output" \
          schemacrawler/schemacrawler:latest \
          /opt/schemacrawler/bin/schemacrawler.sh \
          --server=postgresql \
          --host=host.docker.internal \
          --port=5432 \
          --database=mydb \
          --user=postgres \
          --password=postgres \
          --info-level=standard \
          --command=schema \
          --output-format=png \
          --output-file=./.documentation/schema-diagram.png
      - echo "Schema diagram generated at schema-diagram.png"
  local:database:diagram:mermaid:
    desc: Generate database schema diagram using SchemaCrawler
    cmds:
      - |
        {{.SCHEMACRAWLER_EXEC}} --schemas="public.*" \
            --portable=names \
            --info-level=standard \
            --command script \
            --script-language python \
            --script mermaid.py \
            --output-file {{.SCHEMACRAWLER_SHARE_PATH}}sc.mmd
      - echo "Schema diagram generated at schema-diagram.png"
  local:database:diagram:graphviz:
    desc: Generate database schema diagram using SchemaCrawler
    cmds:
      - |
        {{.SCHEMACRAWLER_EXEC}} \
            --portable=names \
            --info-level=detailed \
            --command schema \
            --load-row-counts \
            --title "Database" \
            --output-format=png --output-file={{.SCHEMACRAWLER_SHARE_PATH}}er.png
      - echo "Schema diagram generated"
  local:database:diagram:graphviz:indexes:
    desc: Generate database schema diagram using SchemaCrawler
    cmds:
      - |
        {{.SCHEMACRAWLER_EXEC}} --schemas="public.*" \
            --portable=names \
            --info-level=detailed \
            --command details \
            --load-row-counts \

            --title "Database" \
            --output-format=png --output-file={{.SCHEMACRAWLER_SHARE_PATH}}indexes.png
      - echo "Schema diagram generated"
  local:database:diagram:dbml:
    desc: Generate database schema diagram using SchemaCrawler
    cmds:
      - |
        {{.SCHEMACRAWLER_EXEC}} --schemas="public.*" \
            --portable=names \
            --info-level=standard \
            --command script \
            --parents 1 \
            --script-language python \
            --script dbml.py \
            --output-file {{.SCHEMACRAWLER_SHARE_PATH}}sc.dbml

      - echo "Schema diagram generated"
  local:database:diagram:json:
    desc: Generate database schema diagram using SchemaCrawler
    cmds:
      - |
        {{.SCHEMACRAWLER_EXEC}} --schemas="public.*" \
            --info-level=maximum \
            --command list \
            --output-format=json \
            --output-file {{.SCHEMACRAWLER_SHARE_PATH}}schema.json

      - echo "Schema diagram generated"
    



  code:diagram:
    desc: Generate UML class diagram from Python code in src folder
    cmds:
      - |
        pyreverse \
          -o png \
          -A \
          -f ALL \
          -p database_as_crime_scene \
          --output-directory ./notebooks/autogenerated \
          ./src/database_as_crime_scene
      - echo "Code diagram generated at notebooks/autogenerated/classes_database_as_crime_scene.png"
  
  code:diagram:mermaid:
    desc: Generate Mermaid diagram showing all classes and functions
    cmds:
      - python3 src/scripts/generate_code_diagram.py src/database_as_crime_scene notebooks/autogenerated/code_diagram.mmd
      - echo "Open notebooks/autogenerated/code_diagram.mmd in VS Code or paste into https://mermaid.live"
  
  code:diagram:pydeps:
    desc: Generate module dependency diagram showing all functions and classes
    cmds:
      - |
        pydeps src/database_as_crime_scene \
          --max-bacon=2 \
          --cluster \
          --show-deps \
          -T svg \
          -o notebooks/autogenerated/code_dependencies.svg
      - echo "Dependency diagram generated at notebooks/autogenerated/code_dependencies.svg"
  
  code:diagram:py2puml:
    desc: Generate PlantUML diagram showing classes and functions
    cmds:
      - |
        py2puml src/database_as_crime_scene database_as_crime_scene > notebooks/autogenerated/code_structure.puml
      - |
        plantuml -tpng notebooks/autogenerated/code_structure.puml
      - echo "Code structure diagram generated at notebooks/autogenerated/code_structure.png"
  
  code:docs:
    desc: Generate HTML documentation showing all functions and classes
    cmds:
      - |
        pdoc \
          --html \
          --output-dir notebooks/autogenerated/docs \
          --force \
          --skip-errors \
          src/database_as_crime_scene
      - echo "Documentation generated at notebooks/autogenerated/docs/database_as_crime_scene/index.html"
  
  local:database:seed:
    desc: Seed database with fake data (default 100 users)
    cmds:
      - docker compose exec notebook python -m database_as_crime_scene.db.feed {{.CLI_ARGS}}
  
  local:database:seed:small:
    desc: Seed database with small amount of fake data (10 users)
    cmds:
      - docker compose exec notebook python -m database_as_crime_scene.db.feed 10 5 3 10
  
  local:database:seed:medium:
    desc: Seed database with medium amount of fake data (1000 users)
    cmds:
      - docker compose exec notebook python -m database_as_crime_scene.db.feed 1000 10 5 20
  
  local:database:seed:large:
    desc: Seed database with large amount of fake data (10000 users)
    cmds:
      - docker compose exec notebook python -m database_as_crime_scene.db.feed 10000 15 8 25
