[project]
name = "database-as-crime-scene"
version = "0.1.0"
dependencies = [
    "jupysql",
    "sqlalchemy",
    "psycopg2-binary",
    "pandas",
    "python-dotenv",
    "pylint",
    "pydeps",
    "pdoc3",
    "rich",
    "rich-tools",
    "faker",
    "numpy"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.jupysql.SqlMagic]
feedback = true
autopandas = false