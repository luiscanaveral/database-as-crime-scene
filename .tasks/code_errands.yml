# https://taskfile.dev

version: '3'

vars:
  GREETING: Hello, World!
  FOLDER: ./notebooks/autogenerated/code/
  

tasks:
  generate-diagram:
    desc: Generate UML class diagram from Python code in src folder
    cmds:
      - |
        pyreverse \
          -o png \
          -A \
          -f ALL \
          -p database_as_crime_scene \
          --output-directory {{.FOLDER}} \
          ./src/database_as_crime_scene
      - echo "Code diagram generated at {{.FOLDER}}classes_database_as_crime_scene.png"
  
  generate-diagram:mermaid:
    desc: Generate Mermaid diagram showing all classes and functions
    cmds:
      - python3 src/scripts/generate_code_diagram.py src/database_as_crime_scene {{.FOLDER}}/code_diagram.mmd
      - echo "Open {{.FOLDER}}code_diagram.mmd in VS Code or paste into https://mermaid.live"
  
  generate-diagram:pydeps:
    desc: Generate module dependency diagram showing all functions and classes
    cmds:
      - |
        pydeps src/database_as_crime_scene \
          --max-bacon=2 \
          --cluster \
          --show-deps \
          -T svg \
          -o {{.FOLDER}}code_dependencies.svg
      - echo "Dependency diagram generated at notebooks/autogenerated/code_dependencies.svg"
  
  generate-diagram:py2puml:
    desc: Generate PlantUML diagram showing classes and functions
    cmds:
      - |
        py2puml src/database_as_crime_scene database_as_crime_scene > {{.FOLDER}}code_structure.puml
      - |
        plantuml -tpng notebooks/autogenerated/code_structure.puml
      - echo "Code structure diagram generated at {{.FOLDER}}code_structure.png"
  
  docs:
    desc: Generate HTML documentation showing all functions and classes
    cmds:
      - |
        pdoc \
          --html \
          --output-dir {{.FOLDER}}docs \
          --force \
          --skip-errors \
          src/database_as_crime_scene
      - echo "Documentation generated at {{.FOLDER}}docs/database_as_crime_scene/index.html"
  