# https://taskfile.dev

version: '3'

vars:
  GREETING: Hello, World!
  FOLDER: ./notebooks/autogenerated/code/
  PYTHON_EXEC: .venv/bin/python
  PIP_EXEC: .venv/bin/pip
  RUFF_EXEC: .venv/bin/ruff
  BLACK_EXEC: .venv/bin/black
  ISORT_EXEC: .venv/bin/isort


tasks:
  init:
    cmds:
      - rm -rf .venv
      - python -m venv .venv 
      - "{{.PIP_EXEC}} install --upgrade -e '.'"
      - echo "Virtual environment created. Run 'source .venv/bin/activate' to activate it." 
  review:
    cmds:
      - "{{.BLACK_EXEC}} src/database_as_crime_scene"
      - "{{.ISORT_EXEC}} src/database_as_crime_scene"
      - "{{.RUFF_EXEC}} format src/database_as_crime_scene"
      - "{{.RUFF_EXEC}} check src/database_as_crime_scene"
      - ".venv/bin/pylint src/database_as_crime_scene"