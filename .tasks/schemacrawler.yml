# https://taskfile.dev

version: '3'

vars:
  GREETING: Hello, World!
  CONTAINER: docker exec -i postgres_db psql -U postgres -d mydb
  SCHEMACRAWLER_SHARE_PATH: /home/schcrwlr/share/
  SC_DOCKER: >-
    docker run --rm --network host
    -v "{{.USER_WORKING_DIR}}/notebooks/autogenerated":/home/schcrwlr/share
    -v "{{.USER_WORKING_DIR}}/.local/schemacrawler/scripts":/home/schcrwlr/scripts
    -e SC_GAVM_OPTS=--polyglot
    schemacrawler:custom
  SC_CONN: >-
    --server=postgresql
    --host=host.docker.internal
    --port=5432
    --database=mydb
    --user=postgres
    --password=postgres
    --schemas="public.*"

tasks:
  mermaid:
    desc: "Export schema as Mermaid ER diagram → notebooks/autogenerated/sc.mmd"
    cmds:
      - "{{.SC_DOCKER}} {{.SC_CONN}} --portable=names --info-level=standard --command script --script-language python --script /opt/schemacrawler/mermaid.py --output-file {{.SCHEMACRAWLER_SHARE_PATH}}sc.mmd"
      - echo "Schema diagram generated at schema-diagram.png"
  graphviz:
    desc: "Export schema as Graphviz ER diagram with row counts → notebooks/autogenerated/er.png"
    cmds:
      - '{{.SC_DOCKER}} {{.SC_CONN}} --portable=names --info-level=detailed --command schema --load-row-counts --title "Database" --output-format=png --output-file={{.SCHEMACRAWLER_SHARE_PATH}}er.png'
      - echo "Schema diagram generated"
  graphviz:indexes:
    desc: "Export schema as Graphviz diagram including indexes and row counts → notebooks/autogenerated/indexes.png"
    cmds:
      - '{{.SC_DOCKER}} {{.SC_CONN}} --portable=names --info-level=detailed --command details --load-row-counts --title "Database" --output-format=png --output-file={{.SCHEMACRAWLER_SHARE_PATH}}indexes.png'
      - echo "Schema diagram generated"
  dbml:
    desc: "Export schema in DBML format (Database Markup Language) → notebooks/autogenerated/sc.dbml"
    cmds:
      - "{{.SC_DOCKER}} {{.SC_CONN}} --portable=names --info-level=standard --command script --script-language python --script /home/schcrwlr/scripts/dbml.py --output-file {{.SCHEMACRAWLER_SHARE_PATH}}sc.dbml"
      - echo "Schema diagram generated"
  json:
    desc: "Export full schema metadata as JSON (maximum detail) → notebooks/autogenerated/schema.json"
    cmds:
      - "{{.SC_DOCKER}} {{.SC_CONN}} --info-level=maximum --command list --output-format=json --output-file {{.SCHEMACRAWLER_SHARE_PATH}}schema.json"
      - echo "Schema diagram generated"