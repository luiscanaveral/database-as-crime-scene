# https://taskfile.dev

version: '3'

vars:
  GREETING: Hello, World!
  CONTAINER: docker exec -i postgres_db psql -U postgres -d mydb
  SCHEMACRAWLER_SHARE_PATH: /home/schcrwlr/share/
  SCHEMACRAWLER_EXEC: | 
    docker run --rm --network host -v "$(pwd)/notebooks/autogenerated":/home/schcrwlr/share \
          -e SC_GAVM_OPTS="--polyglot --jvm --vm.allowAllAccess=true --add-opens=java.base/java.lang=ALL-UNNAMED" \
          schemacrawler:custom \
            --server=postgresql \
            --host=host.docker.internal \
            --port=5432 \
            --database=mydb \
            --user=postgres \
            --password=postgres \
            --schemas="public.*" \

tasks:
  mermaid:
    desc: Generate database schema diagram using SchemaCrawler
    cmds:
      - |
        {{.SCHEMACRAWLER_EXEC}} \
            --portable=names \
            --info-level=standard \
            --command script \
            --script-language python \
            --script /opt/schemacrawler/mermaid.py \
            --output-file {{.SCHEMACRAWLER_SHARE_PATH}}sc.mmd
      - echo "Schema diagram generated at schema-diagram.png"
  graphviz:
    desc: Generate database schema diagram using SchemaCrawler
    cmds:
      - |
        {{.SCHEMACRAWLER_EXEC}} \
            --portable=names \
            --info-level=detailed \
            --command schema \
            --load-row-counts \
            --title "Database" \
            --output-format=png --output-file={{.SCHEMACRAWLER_SHARE_PATH}}er.png
      - echo "Schema diagram generated"
  graphviz:indexes:
    desc: Generate database schema diagram using SchemaCrawler
    cmds:
      - |
        {{.SCHEMACRAWLER_EXEC}} \
            --portable=names \
            --info-level=detailed \
            --command details \
            --load-row-counts \
            --title "Database" \
            --output-format=png --output-file={{.SCHEMACRAWLER_SHARE_PATH}}indexes.png
      - echo "Schema diagram generated"
  dbml:
    desc: Generate database schema diagram using SchemaCrawler
    cmds:
      - |
        {{.SCHEMACRAWLER_EXEC}} \
            --portable=names \
            --info-level=standard \
            --command script \
            --parents 1 \
            --script-language python \
            --script /opt/schemacrawler/dbml.py \
            --output-file {{.SCHEMACRAWLER_SHARE_PATH}}sc.dbml

      - echo "Schema diagram generated"
  json:
    desc: Generate database schema diagram using SchemaCrawler
    cmds:
      - |
        {{.SCHEMACRAWLER_EXEC}} \
            --info-level=maximum \
            --command list \
            --output-format=json \
            --output-file {{.SCHEMACRAWLER_SHARE_PATH}}schema.json

      - echo "Schema diagram generated"